<!DOCTYPE html>
<!--
  Lead magnet template. /lead-magnet copies this and fills every {{…}}.
  Brand: only change the :root variables (from brand/design-tokens.json). Everything else uses them.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}} | {{BUSINESS_NAME}}</title>
  <meta name="description" content="{{SUBTITLE}}">
  <!-- {{FONT_LINK}}: Google Fonts <link> for the brand fonts, or delete to use system fonts -->
  <style>
    :root {
      --bg: #faf8f5;
      --surface: #ffffff;
      --text: #1d1b19;
      --muted: #6b6560;
      --border: #e6e1da;
      --accent: #2f5d50;
      --accent-text: #ffffff;
      --font-heading: Georgia, "Times New Roman", serif;
      --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font: 17px/1.65 var(--font-body); }
    .container { max-width: 680px; margin: 0 auto; padding: 48px 20px 64px; }

    .brand { font: 600 14px/1 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 32px; }
    h1 { font: 700 clamp(30px, 6vw, 44px)/1.15 var(--font-heading); margin-bottom: 12px; }
    .subtitle { font-size: 19px; color: var(--muted); margin-bottom: 32px; }
    h2 { font: 700 24px/1.25 var(--font-heading); margin-bottom: 12px; }
    p + p { margin-top: 14px; }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; margin-bottom: 24px; }
    .label { display: inline-block; font: 700 12px/1 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }
    .section-desc { color: var(--muted); margin-bottom: 16px; }

    .items { list-style: none; }
    .items li { padding: 14px 0 14px 32px; border-top: 1px solid var(--border); position: relative; }
    .items li:first-child { border-top: 0; }
    .items li::before { content: ""; position: absolute; left: 4px; top: 22px; width: 12px; height: 12px; border: 2px solid var(--accent); border-radius: 3px; }
    .items .why { display: block; color: var(--muted); font-size: 15px; font-style: italic; margin-top: 4px; }

    .note { font-size: 14px; color: var(--muted); border-left: 3px solid var(--border); padding-left: 14px; margin-top: 16px; }

    /* Email gate */
    .gate-teaser { position: relative; max-height: 300px; overflow: hidden; }
    .gate-teaser::after { content: ""; position: absolute; inset: auto 0 0; height: 160px; background: linear-gradient(transparent, var(--bg)); }
    .gate-wall { text-align: center; padding: 32px 28px; }
    .gate-wall h2 { margin-bottom: 8px; }
    .gate-wall p { color: var(--muted); margin-bottom: 20px; }
    .gate-form { display: grid; gap: 10px; max-width: 380px; margin: 0 auto; text-align: left; }
    .gate-form label { font-size: 14px; font-weight: 600; }
    .gate-form input { font: inherit; padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); }
    .btn { font: 600 17px/1 var(--font-body); padding: 15px 22px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-text); cursor: pointer; text-decoration: none; display: inline-block; text-align: center; }
    .btn:hover { filter: brightness(1.08); }
    .gate-form .fine { font-size: 13px; color: var(--muted); text-align: center; }
    .gated { display: none; }
    body.unlocked .gated { display: block; }
    body.unlocked .gate-teaser, body.unlocked .gate-wall { display: none; }

    .cta { text-align: center; }
    .cta p { color: var(--muted); margin: 8px 0 20px; }
    footer { text-align: center; font-size: 14px; color: var(--muted); margin-top: 40px; }

    @media (max-width: 680px) { .container { padding-top: 32px; } .card { padding: 22px; } }
    @media (max-width: 400px) { body { font-size: 16px; } .card { padding: 18px; } }
    @media print {
      .gate-teaser, .gate-wall, .cta { display: none !important; }
      .gated { display: block !important; }
      .card { border: 0; padding: 0; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand">{{BUSINESS_NAME}}</div>
    <h1>{{TITLE}}</h1>
    <p class="subtitle">{{SUBTITLE}}</p>

    <div class="card">
      <!-- {{INTRO}}: 2–3 short paragraphs. The worry → why it matters → what this resource does about it. -->
    </div>

    <!-- Teaser: section 1, fading out -->
    <div class="gate-teaser" aria-hidden="true">
      <!-- {{SECTION_1}} -->
    </div>

    <div class="card gate-wall">
      <h2>{{GATE_TITLE}}</h2>
      <p>{{GATE_SUBTITLE}}</p>
      <form class="gate-form" id="gate-form">
        <label for="gate-name">First name</label>
        <input type="text" id="gate-name" name="name" autocomplete="given-name">
        <label for="gate-email">Email</label>
        <input type="email" id="gate-email" name="email" required autocomplete="email" placeholder="you@example.com">
        <button type="submit" class="btn">{{GATE_BUTTON}}</button>
        <p class="fine">{{GATE_FINE_PRINT}}</p>
      </form>
    </div>

    <div class="gated">
      <!-- {{SECTION_1}} again, then {{SECTIONS_2_TO_N}}. Pattern per section:
      <div class="card">
        <span class="label">Section name</span>
        <h2>Section heading</h2>
        <p class="section-desc">One line on what this section covers.</p>
        <ul class="items">
          <li>Item <span class="why">Why it matters</span></li>
        </ul>
      </div>
      -->

      <div class="card cta">
        <h2>{{CTA_TITLE}}</h2>
        <p>{{CTA_TEXT}}</p>
        <a class="btn" href="{{CTA_LINK}}">{{CTA_BUTTON}}</a>
      </div>
    </div>

    <footer>{{FOOTER}}</footer>
  </div>

  <script>
    (function () {
      var SLUG = '{{SLUG}}';
      // Set by /crm-connect (Round 7). Empty = leads are only kept in this browser.
      var LEAD_ENDPOINT = '';
      var KEY = 'lead-magnet-' + SLUG;

      function unlock() { document.body.classList.add('unlocked'); }
      try { if (localStorage.getItem(KEY)) unlock(); } catch (e) {}

      document.getElementById('gate-form').addEventListener('submit', function (e) {
        e.preventDefault();
        var params = new URLSearchParams(location.search);
        var lead = {
          name: document.getElementById('gate-name').value.trim(),
          email: document.getElementById('gate-email').value.trim(),
          source: 'lead-magnet:' + SLUG,
          utm_source: params.get('utm_source') || '',
          utm_medium: params.get('utm_medium') || '',
          utm_campaign: params.get('utm_campaign') || '',
          created_at: new Date().toISOString()
        };
        try { localStorage.setItem(KEY, JSON.stringify(lead)); } catch (err) {}
        if (LEAD_ENDPOINT) {
          fetch(LEAD_ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(lead) })
            .catch(function () {});
        }
        unlock(); // never block the reader, even if saving fails
      });
    })();
  </script>
</body>
</html>
